# Publica el juego en GitHub Pages cada vez que se sube algo a main.
# El juego corre entero en el navegador, así que basta con servir index.html y src/.
# Primero corren los tests: si fallan, no se publica.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, se publica el último y no se corta uno a medias
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Solo lo que el navegador necesita: nada de tests ni node_modules
      - name: Preparar la carpeta del sitio
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
